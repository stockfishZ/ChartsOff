name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/daily_pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee install.log || {
            ERR=$(tail -n 20 install.log | tr '\n' ' ')
            echo "::error title=NPM Install Failed::$ERR"
            exit 1
          }

      - name: Build Vite Web Assets
        working-directory: ./frontend
        run: |
          npm run build 2>&1 | tee build.log || {
            ERR=$(tail -n 20 build.log | tr '\n' ' ')
            echo "::error title=Vite Build Failed::$ERR"
            exit 1
          }

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: |
          ./node_modules/.bin/cap sync android 2>&1 | tee sync.log || {
            ERR=$(tail -n 20 sync.log | tr '\n' ' ')
            echo "::error title=Capacitor Sync Failed::$ERR"
            exit 1
          }

      - name: Make Gradle Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle.log || {
            ERR=$(grep -E "(FAILURE:|Caused by:|What went wrong:)" -A 5 gradle.log | head -n 12 | tr '\n' ' ' | cut -c 1-500)
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 25 gradle.log | tr '\n' ' ' | cut -c 1-500)
            fi
            echo "::error title=Gradle Root Cause::$ERR"
            exit 1
          }

      - name: Locate and Stage APK
        run: |
          mkdir -p release_apk
          echo "=== SEARCHING FOR APK FILES ==="
          find . -name "*.apk" | tee apk_list.txt
          if [ -s apk_list.txt ]; then
            FIRST_APK=$(head -n 1 apk_list.txt)
            echo "Found APK at: $FIRST_APK"
            cp "$FIRST_APK" release_apk/ChartsOff.apk
            ls -lh release_apk/ChartsOff.apk
          else
            GRADLE_TAIL=$(tail -n 25 frontend/android/gradle.log | tr '\n' ' ' | cut -c 1-450)
            echo "::error title=Gradle Log Output::$GRADLE_TAIL"
            BUILD_FILES=$(find frontend/android/app/build -maxdepth 4 -type f 2>/dev/null | head -n 20 | tr '\n' ' ' | cut -c 1-450)
            echo "::error title=Build Output Files::$BUILD_FILES"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChartsOff-Debug-APK
          path: release_apk/ChartsOff.apk
          if-no-files-found: error
          retention-days: 30
