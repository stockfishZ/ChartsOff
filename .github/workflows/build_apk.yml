name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/daily_pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee install.log || {
            ERR=$(tail -n 20 install.log | tr '\n' ' ')
            echo "::error title=NPM Install Failed::$ERR"
            exit 1
          }

      - name: Build Vite Web Assets
        working-directory: ./frontend
        run: |
          npm run build 2>&1 | tee build.log || {
            ERR=$(tail -n 20 build.log | tr '\n' ' ')
            echo "::error title=Vite Build Failed::$ERR"
            exit 1
          }

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: |
          ./node_modules/.bin/cap sync android 2>&1 | tee sync.log || {
            ERR=$(tail -n 20 sync.log | tr '\n' ' ')
            echo "::error title=Capacitor Sync Failed::$ERR"
            exit 1
          }

      - name: Make Gradle Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChartsOff-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
