name: Automated Daily Stock Prediction Pipeline

on:
  schedule:
    # Runs Monday to Friday at 09:30 UTC (16:30 WIB / GMT+7), 30 mins after IDX Market Close
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  run-pipeline-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt fastapi uvicorn

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Machine Learning Pipeline
        run: |
          python -m src.pipeline

      - name: Build Web & Mobile Assets
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Commit and Push Updated Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/latest_predictions.json frontend/public/data/latest_predictions.json frontend/dist/ frontend/android/app/src/main/assets/public/
          
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update daily IDX predictions and news thumbnails [skip ci]"
            git push origin main
          fi
